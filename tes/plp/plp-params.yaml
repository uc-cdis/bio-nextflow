seed: 42
sample_size: 10000
dataset_id: 1
outcome_id: 3
dataset_observation_window: 365
outcome_observation_window: 3650
require_time_at_risk: false
min_time_at_risk: 364
include_all_outcomes: true
first_exposure_only: false
remove_subjects_with_prior_outcome: true
covariate_min_fraction: 0.001
test_fraction: 0.25
n_fold: 3
plpRunName: "plp_run_output"
#dataset_size: 0
#training_set_size: 0
#test_set_size: 0
# TODO: PR36 added file_name to model params, test without them after the fix
model_list:
  - name: "Lasso Logistic Regression"
    file_name: "lasso_logistic_regression"
    params:
      variance: 0.01
      seed: 42
  - name: "Random Forest"
    file_name: "random_forest"
    params:
      ntrees: [500]
      criterion: ["gini"]
      maxDepth: [17]
      minSamplesSplit: [2]
      minSamplesLeaf: [10]
      minWeightFractionLeaf: [0]
      mtries: ["sqrt"]
      maxLeafNodes: [100]
      minImpurityDecrease: [0]
      bootstrap: [true]
      maxSamples: [0.9]
      oobScore: [false]
      classWeight: ["balanced"]
      seed: 42
